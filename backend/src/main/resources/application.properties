# Application name
spring.application.name=backend
# Database connection
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wandr}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wandr}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wandr}

# JPA settings
spring.jpa.hibernate.ddl-auto=update

# Backend server port
server.port=${SERVER_PORT:8080}

# Third-party API URLs
google.places.api.url=https://maps.googleapis.com/maps/api/place/nearbysearch/json
wikipedia.api.url=https://en.wikipedia.org/api/rest_v1/page/summary/
wikipedia.search.url=https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&srsearch=
openai.api.url=https://api.openai.com/v1/chat/completions

# Static resources location in server
spring.web.resources.static-locations=file:/app/uploads/

#uncomment to locally test
#spring.web.resources.static-locations=file:./uploads/

spring.web.resources.chain.enabled=true
spring.web.resources.cache.period=3600

core.backend.url=${CORE_BACKEND_URL:http://localhost:8080}

recommendation.api.url=${RECOMMENDATION_API_URL:http://localhost:8000/wandr/recommendations}


# Enable debug logging for WebSocket, STOMP, and message broker
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging.simp=DEBUG
logging.level.org.springframework.messaging.simp.broker=DEBUG
logging.level.org.springframework.web.servlet=DEBUG